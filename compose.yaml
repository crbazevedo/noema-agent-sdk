name: noema

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: noema
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema-dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - noema-postgres:/var/lib/postgresql/data

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - noema-nats:/data

volumes:
  noema-postgres:
  noema-nats:
