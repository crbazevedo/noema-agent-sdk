[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-agent-sdk"
version = "0.2.0"
description = "Async, event-sourced, situation-aware SDK for autonomous agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Carlos R. B. Azevedo" }
]
keywords = [
  "agents",
  "agentic-ai",
  "autonomous-systems",
  "event-driven",
  "asyncio",
  "event-sourcing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]
nats = [
  "nats-py>=2.9",
]
openai = [
  "openai>=1.66",
]
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
distributed = [
  "psycopg[binary]>=3.2",
  "nats-py>=2.9",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
all = [
  "psycopg[binary]>=3.2",
  "nats-py>=2.9",
  "openai>=1.66",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["noema"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
